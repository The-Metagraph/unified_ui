name: Quality and Tests

on:
  pull_request:
    paths:
      - ".github/workflows/quality-and-tests.yml"
      - ".githooks/pre-commit"
      - "mix.exs"
      - "mix.lock"
      - "lib/**"
      - "test/**"
      - "packages/**"

env:
  ELIXIR_VERSION: "1.19.0"
  OTP_VERSION: "27.0"

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install root dependencies
        run: mix deps.get

      - name: Run pre-commit parity checks
        run: ./.githooks/pre-commit

  root-tests:
    name: root-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install root dependencies
        run: mix deps.get

      - name: Run root tests
        run: mix test

  package-tests:
    name: package-tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: unified_iur
            path: packages/unified_iur
          - package: live_ui
            path: packages/live_ui
          - package: web_ui
            path: packages/web_ui

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install package dependencies
        run: mix deps.get

      - name: Run package tests
        run: mix test
