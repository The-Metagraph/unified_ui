name: Frontend Toolchain

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Elm/Tailwind/DaisyUI Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Validate frontend toolchain
        run: ./scripts/validate_frontend_toolchain.sh

      - name: Validate frontend transport contract parity
        run: ./scripts/validate_frontend_transport_contract.sh

      - name: Validate frontend CloudEvent contract parity
        run: ./scripts/validate_frontend_cloudevent_contract.sh

      - name: Validate frontend runtime-context contract parity
        run: ./scripts/validate_frontend_runtime_context_contract.sh

      - name: Validate frontend widget event catalog contract parity
        run: ./scripts/validate_frontend_event_catalog_contract.sh

      - name: Validate frontend widget event payload contract parity
        run: ./scripts/validate_frontend_event_payload_contract.sh

      - name: Validate frontend widget event route contract parity
        run: ./scripts/validate_frontend_event_route_contract.sh

      - name: Validate frontend widget event route-family contract parity
        run: ./scripts/validate_frontend_event_route_family_contract.sh

      - name: Validate frontend widget event route-keys contract parity
        run: ./scripts/validate_frontend_event_route_keys_contract.sh

      - name: Validate frontend widget event route-key ordering parity
        run: ./scripts/validate_frontend_event_route_key_order_contract.sh

      - name: Validate frontend widget event route-key completeness parity
        run: ./scripts/validate_frontend_event_route_key_completeness_contract.sh

      - name: Validate frontend widget event route-key allowlist parity
        run: ./scripts/validate_frontend_event_route_key_allowlist_contract.sh

      - name: Validate frontend widget event route-key payload-shape parity
        run: ./scripts/validate_frontend_event_route_key_shape_contract.sh

      - name: Validate frontend widget event route-key value-shape parity
        run: ./scripts/validate_frontend_event_route_key_value_contract.sh

      - name: Validate frontend widget event route-key value-source parity
        run: ./scripts/validate_frontend_event_route_key_source_contract.sh

      - name: Validate frontend widget event route-key source-requirements parity
        run: ./scripts/validate_frontend_event_route_key_source_requirements_contract.sh

      - name: Validate frontend widget event route-key source-key parity
        run: ./scripts/validate_frontend_event_route_key_source_keys_contract.sh

      - name: Validate frontend widget event route-key source-key to route-key parity
        run: ./scripts/validate_frontend_event_route_key_source_key_parity_contract.sh
