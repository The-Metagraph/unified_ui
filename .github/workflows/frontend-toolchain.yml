name: Frontend Toolchain

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Elm/Tailwind/DaisyUI Toolchain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Validate frontend toolchain
        run: ./scripts/validate_frontend_toolchain.sh

      - name: Validate frontend transport contract parity
        run: ./scripts/validate_frontend_transport_contract.sh

      - name: Validate frontend CloudEvent contract parity
        run: ./scripts/validate_frontend_cloudevent_contract.sh

      - name: Validate frontend runtime-context contract parity
        run: ./scripts/validate_frontend_runtime_context_contract.sh

      - name: Validate frontend widget event catalog contract parity
        run: ./scripts/validate_frontend_event_catalog_contract.sh
